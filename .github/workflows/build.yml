---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default variant: GNOME + NVIDIA, published as :latest
          - variant: default
            containerfile: Containerfile
            tag: latest
            desc: "Custom Bazzite (GNOME/NVIDIA) without Steam, Lutris, Waydroid. Tailscale enabled by default."
            keywords: "bootc,ublue,universal-blue,bazzite,nvidia,gnome"
          # Beelink variant: KDE + AMD, no nvidia, OpenRazer support, published as :beelink
          - variant: beelink
            containerfile: Containerfile.beelink
            tag: beelink
            desc: "Custom Bazzite (KDE/AMD) for Beelink mini-PCs: no nvidia, AMD tools, Razer Basilisk V3 Pro support, Tailscale enabled."
            keywords: "bootc,ublue,universal-blue,bazzite,kde,amd"

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are kept up to date by Dependabot (.github/dependabot.yml)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Skip the expensive image build when a push/PR touches only docs (**.md,
      # LICENSE, docs/**). The job still runs so its required status check reports,
      # but the heavy steps below are guarded on steps.detect.outputs.docs_only.
      # schedule/workflow_dispatch always build (no diff base).
      - name: Detect docs-only change
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [ "$EVENT" = "push" ]; then
            changed=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '(\.md$|^LICENSE$|^docs/)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true — skipping image build" >&2
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        if: steps.detect.outputs.docs_only != 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Record which Bazzite base this image is built from, so the release job can
      # map our build to Bazzite's own dated releases (44.YYYYMMDD) without pulling
      # any image. We read the base tag's own org.opencontainers.image.version label
      # (Bazzite sets this to its release version). Baked below as dev.otonm.base.*.
      # The base ref is read straight from the Containerfile's FROM line (single
      # source of truth) rather than a matrix field — a matrix key would change the
      # auto-generated job name and break the required-status-check contexts.
      # Note: buildah pulls :stable independently, so a mid-run :stable move could
      # make this digest differ from what actually built — same-day drift is rare
      # and the release job also has a date-match fallback, so we don't pin here.
      - name: Inspect base image
        id: baseinfo
        if: steps.detect.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          base="$(grep -m1 '^FROM ghcr.io' './${{ matrix.containerfile }}' | awk '{print $2}')"
          echo "Base image (from ${{ matrix.containerfile }}): ${base}"
          raw="$(skopeo inspect "docker://${base}")"
          ver="$(printf '%s' "$raw" | jq -r '.Labels["org.opencontainers.image.version"] // ""')"
          dig="$(printf '%s' "$raw" | jq -r '.Digest // ""')"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "digest=${dig}" >> "$GITHUB_OUTPUT"
          echo "Base ${base} -> version='${ver}' digest='${dig}'"

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}.{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag }}-,enable=${{ github.event_name == 'pull_request' }}
            type=ref,prefix=${{ matrix.tag }}-pr-,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ matrix.desc }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ matrix.tag }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ matrix.keywords }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
            dev.otonm.base.version=${{ steps.baseinfo.outputs.version }}
            dev.otonm.base.digest=${{ steps.baseinfo.outputs.digest }}
          sep-tags: " "
          sep-annotations: " "

      # Build once, promote on merge. A PR build pushes a per-PR staging tag
      # (:<tag>-pr-<N>); the merge to main then just re-tags that already-built,
      # already-rechunked image to the release tags instead of rebuilding. This
      # step decides which path we're on:
      #   - pull_request  -> pr=<N>, promote=false (we build + push staging below)
      #   - push (merge)  -> pr parsed from the squash commit "(#N)"; promote=true
      #                      ONLY if that staging image actually exists in GHCR
      #   - schedule/dispatch -> pr="", promote=false (always rebuild for fresh
      #                      base-image updates)
      # If a merge can't find its staged image, promote stays false and we fall
      # back to a normal build+push+sign — so publishing can never silently break.
      - name: Plan build vs promote
        id: plan
        if: steps.detect.outputs.docs_only != 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_EVENT_NUM: ${{ github.event.number }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          promote=false
          pr=""
          if [ "$EVENT" = "pull_request" ]; then
            pr="$PR_EVENT_NUM"
          elif [ "$EVENT" = "push" ]; then
            # squash-merge subject ends with "(#N)"; merge-commit is "#N" too
            pr="$(printf '%s' "$HEAD_MSG" | head -1 | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)"
          fi
          staging_tag=""
          if [ -n "${pr}" ]; then
            staging_tag="${{ matrix.tag }}-pr-${pr}"
          fi
          # Promote only on a merge, and only if the PR's staged image is present.
          if [ "$EVENT" = "push" ] && [ -n "${staging_tag}" ]; then
            if skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${staging_tag}" >/dev/null 2>&1; then
              promote=true
            fi
          fi
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "staging_tag=${staging_tag}" >> "$GITHUB_OUTPUT"
          echo "promote=${promote}" >> "$GITHUB_OUTPUT"
          echo "Plan: event=${EVENT} pr=${pr:-none} staging_tag=${staging_tag:-none} promote=${promote}"

      - name: Build Image
        id: build_image
        if: steps.detect.outputs.docs_only != 'true' && steps.plan.outputs.promote != 'true'
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./${{ matrix.containerfile }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false

      # Record the built image's package set so the release job can publish a real
      # package-level changelog. This is not redundant with the Bazzite base notes:
      # the stable base only moves on Bazzite's release cadence (~weekly), while our
      # own layer drifts on every build because common.sh installs Brave and the
      # podman compose stack from live repos and build-beelink.sh compiles OpenRazer
      # against the base's kernel-devel. Without this, a frozen-base day reports
      # nothing even when packages actually moved.
      # Read here rather than after rechunk: chunkah only re-lays-out the layers, so
      # package content is identical either side of it.
      - name: Extract RPM manifest
        if: steps.detect.outputs.docs_only != 'true' && steps.plan.outputs.promote != 'true'
        run: |
          set -euo pipefail
          SRC="localhost/${IMAGE_NAME}:${{ matrix.tag }}"
          # Fedora atomic keeps the rpmdb at /usr/lib/sysimage/rpm; rpm's own macros
          # normally point there already, so only fall back to an explicit --dbpath.
          raw=""
          for dbpath in "" /usr/lib/sysimage/rpm; do
            args=(-qa --qf '%{NAME}\t%{EVR}\n')
            [ -n "$dbpath" ] && args+=(--dbpath "$dbpath")
            raw="$(podman run --rm --entrypoint /usr/bin/rpm "${SRC}" "${args[@]}" || true)"
            [ -n "$raw" ] && break
          done
          # gpg-pubkey isn't a package — it's ~19 keyring entries sharing one name,
          # which would collapse into a single unreadable cell in the diff table.
          raw="$(printf '%s\n' "$raw" | grep -v '^gpg-pubkey	' || true)"
          # Collapse to one line per name — a name can have several versions
          # installed (kernels), and the release job's join keys on the name.
          # Skip exact NAME+EVR repeats: multilib packages (i686 + x86_64) are two
          # rpms with identical name and version, which would otherwise render as
          # "1:26.1.5-2.fc44, 1:26.1.5-2.fc44".
          printf '%s\n' "$raw" \
            | awk -F'\t' 'NF==2 { if (seen[$1 SUBSEP $2]++) next
                                  if (a[$1] == "") a[$1]=$2; else a[$1]=a[$1] ", " $2 }
                          END { for (k in a) print k "\t" a[k] }' \
            | LC_ALL=C sort > "${RUNNER_TEMP}/rpmdb.txt"
          count="$(wc -l < "${RUNNER_TEMP}/rpmdb.txt")"
          echo "packages in ${SRC}: ${count}"
          # A truncated manifest published today would render as a bogus "everything
          # removed" diff tomorrow, so fail loudly instead of publishing one.
          if [ "$count" -lt 100 ]; then
            echo "::error::RPM manifest looks wrong (${count} packages) — refusing to publish it"
            exit 1
          fi
          # Package the manifest as a tiny FROM-scratch image so the release job can
          # read it for a few kB instead of pulling a multi-GB image. Pushed below as
          # :<tag>-rpmdb by whichever publish path this run is on. Built from its own
          # context dir, not the repo, so .dockerignore can never silently exclude the
          # manifest and neither can the repo bloat this image.
          ctx="${RUNNER_TEMP}/rpmdb-ctx"
          mkdir -p "${ctx}"
          mv "${RUNNER_TEMP}/rpmdb.txt" "${ctx}/rpmdb.txt"
          printf 'FROM scratch\nCOPY rpmdb.txt /rpmdb.txt\n' > "${ctx}/Containerfile"
          podman build -t "localhost/${IMAGE_NAME}-rpmdb:src" "${ctx}"

      # Rechunk splits the single huge build layer into many content-based layers,
      # which improves pull resumability and shrinks update deltas (it does not
      # speed up a fresh download). We use chunkah — the ublue image-template's
      # recommended/future-default rechunker (its `just rechunk` recipe) — which,
      # unlike legacy-rechunk, runs entirely in rootless podman (no root store
      # bridge) and preserves the image config/labels via CHUNKAH_CONFIG_STR.
      # chunkah reads the built image via an image mount, emits content-based
      # layers, and pipes the result back into podman under the same tag; we then
      # re-apply the remaining metadata tags so the push step publishes it.
      # Runs per matrix variant, so both tags are rechunked.
      - name: Rechunk with chunkah
        if: steps.detect.outputs.docs_only != 'true' && steps.plan.outputs.promote != 'true'
        run: |
          set -euxo pipefail
          SRC="localhost/${IMAGE_NAME}:${{ matrix.tag }}"
          export CHUNKAH_CONFIG_STR="$(podman inspect "${SRC}")"
          podman run --rm \
            --mount=type=image,src="${SRC}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --tag "${SRC}" | podman load
          # chunkah loaded the chunked image as ${SRC} (matrix.tag). Point the
          # other metadata tags (date, sha, pr) at it too, so Push publishes the
          # chunked image under every tag.
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman tag "${SRC}" "${IMAGE_NAME}:${tag}"
          done

      # Log in whenever we're going to push something: a same-repo PR (staging
      # tag), a merge/cron/dispatch on main (release tags), or a promote copy.
      # Fork PRs have no secrets and never push, so they're excluded.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: >-
          steps.detect.outputs.docs_only != 'true' &&
          (github.event.pull_request.head.repo.full_name == github.repository ||
           (github.event_name != 'pull_request' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds don't publish release tags — they push only the per-PR staging
      # tag so the eventual merge can promote this exact (built + rechunked) image.
      - name: Push staging image (PR)
        if: >-
          steps.detect.outputs.docs_only != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          STAGE: ${{ steps.plan.outputs.staging_tag }}
        run: |
          set -euxo pipefail
          podman push "${IMAGE_NAME}:${STAGE}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${STAGE}"

      # The manifest sidecar travels with the staging image so the merge can promote
      # both together — that's what lets the release job read a manifest on the
      # promote path, where no image was built locally.
      - name: Push RPM manifest sidecar (PR)
        if: >-
          steps.detect.outputs.docs_only != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          STAGE: ${{ steps.plan.outputs.staging_tag }}
        run: |
          set -euxo pipefail
          podman push "localhost/${IMAGE_NAME}-rpmdb:src" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${STAGE}-rpmdb"

      # Merge with a matching staged image: re-tag it to the release tags instead
      # of rebuilding. Source is public (no creds); dest needs push creds.
      - name: Promote staged image (merge)
        if: steps.plan.outputs.promote == 'true'
        env:
          STAGE: ${{ steps.plan.outputs.staging_tag }}
        run: |
          set -euxo pipefail
          for tag in ${{ steps.metadata.outputs.tags }}; do
            skopeo copy --all \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${STAGE}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

      # Same promote, for the manifest sidecar: copy the PR's manifest onto today's
      # dated tag so the release job finds it exactly where a build path would leave
      # it. Only the dated sidecar is needed (the release job resolves the previous
      # dated tag), so we don't publish a moving :<variant>-rpmdb.
      - name: Promote RPM manifest sidecar (merge)
        if: steps.plan.outputs.promote == 'true'
        env:
          STAGE: ${{ steps.plan.outputs.staging_tag }}
        run: |
          set -euxo pipefail
          # Take the dated tag from the metadata step's own output rather than
          # recomputing the date, so the sidecar can never end up on a different day
          # than the image it describes.
          dated=""
          for tag in ${{ steps.metadata.outputs.tags }}; do
            case "$tag" in ${{ matrix.tag }}.????????) dated="$tag" ;; esac
          done
          [ -n "$dated" ]
          skopeo copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${STAGE}-rpmdb" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${dated}-rpmdb"

      # Normal publish for merge-without-staging, cron, and dispatch (i.e. when we
      # actually built above). Skipped when we promoted a prebuilt image.
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.detect.outputs.docs_only != 'true' &&
          steps.plan.outputs.promote != 'true'
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # Companion to Push To GHCR (build path): publish the manifest sidecar under
      # today's dated tag. Sidecars are metadata, not bootable images, so they are
      # deliberately left out of the cosign loop below.
      - name: Push RPM manifest sidecar
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.detect.outputs.docs_only != 'true' &&
          steps.plan.outputs.promote != 'true'
        run: |
          set -euxo pipefail
          dated=""
          for tag in ${{ steps.metadata.outputs.tags }}; do
            case "$tag" in ${{ matrix.tag }}.????????) dated="$tag" ;; esac
          done
          [ -n "$dated" ]
          podman push "localhost/${IMAGE_NAME}-rpmdb:src" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${dated}-rpmdb"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.detect.outputs.docs_only != 'true'
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.detect.outputs.docs_only != 'true'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  # After both variants publish, create ONE dated GitHub Release whose notes summarise
  # (1) what moved in the Bazzite base — sourced from Bazzite's own dated releases
  # (44.YYYYMMDD), no image pull needed, via the dev.otonm.base.version label we baked
  # onto each image in build_push; (2) the package-level diff of our own images, read
  # from the `<tag>-rpmdb` manifest sidecars, which is what shows drift on the many
  # days Bazzite's stable base doesn't move; and (3) what changed in this repo since
  # the last release. Runs once (not per-variant). Only on real publishes; a release is
  # created only when something actually changed, so idle cron days produce nothing.
  release:
    name: Publish GitHub release
    needs: build_push
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create releases + their git tags
      packages: read
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build changelog and publish release
        run: |
          set -euo pipefail
          REPO_IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          DATE="$(date -u +%Y%m%d)"

          # Authenticate skopeo so list-tags / inspect aren't rate-limited on GHCR.
          echo "${GH_TOKEN}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

          # --- Publish gate: today's dated :latest tag must exist -----------------
          # If it doesn't, no image was published this run (docs-only push, or a run
          # that didn't push) — so there is nothing to release.
          if ! skopeo inspect "docker://${REPO_IMG}:latest.${DATE}" >/dev/null 2>&1; then
            echo "No published :latest.${DATE} tag — nothing to release."
            exit 0
          fi

          base_version_of() {   # $1 = full image ref -> dev.otonm.base.version label
            skopeo inspect "docker://$1" 2>/dev/null \
              | jq -r '.Labels["dev.otonm.base.version"] // ""'
          }
          prev_dated_tag() {    # $1 = variant tag -> greatest <variant>.YYYYMMDD below today
            skopeo list-tags "docker://${REPO_IMG}" 2>/dev/null \
              | jq -r '.Tags[]' \
              | grep -E "^$1\.[0-9]{8}$" \
              | sort \
              | awk -v cur="$1.${DATE}" '$0 < cur' \
              | tail -1
          }
          date_of_ver() { printf '%s' "$1" | grep -oE '[0-9]{8}' | head -1; }

          # --- Per variant: new/prev Bazzite base version + boundary dates --------
          # Dates are 8-digit YYYYMMDD, so integer comparison is chronological.
          # || true guards each substitution: with pipefail set, a no-match grep or
          # a missing prev tag (first-ever build) is expected, not fatal.
          hi_date=""; lo_date=""
          first_build=true      # true only when no previous dated tag exists at all
          unknown_prev=""       # variants whose previous image carries no base label
          declare -A NEW_BASE PREV_BASE PREV_TAG
          for v in latest beelink; do
            nb="$(base_version_of "${REPO_IMG}:${v}.${DATE}" || true)"
            pt="$(prev_dated_tag "$v" || true)"
            pb=""; [ -n "$pt" ] && pb="$(base_version_of "${REPO_IMG}:${pt}" || true)"
            NEW_BASE[$v]="$nb"; PREV_BASE[$v]="$pb"; PREV_TAG[$v]="$pt"
            [ -n "$pt" ] && first_build=false

            # hi: newest base date we're now on (fallback: our own build date).
            nd="$(date_of_ver "$nb" || true)"; [ -z "$nd" ] && nd="$DATE"
            if [ -z "$hi_date" ] || [ "$nd" -gt "$hi_date" ]; then hi_date="$nd"; fi
            # lo: oldest base date we were previously on, taken from the label only.
            # Never fall back to the previous *image tag's* date: our build date is
            # always >= the base date, so that fallback can only ever push lo too
            # high and silently drop Bazzite releases from the range (which is what
            # dropped 44.20260721 from the 2026-07-22 notes).
            pd="$(date_of_ver "$pb" || true)"
            if [ -n "$pd" ]; then
              if [ -z "$lo_date" ] || [ "$pd" -lt "$lo_date" ]; then lo_date="$pd"; fi
            elif [ -n "$pt" ]; then
              unknown_prev="${unknown_prev}${unknown_prev:+, }:${v}"
            fi
          done
          echo "Base date range: lo=${lo_date:-none} hi=${hi_date} first_build=${first_build} unknown_prev=${unknown_prev:-none}"

          # --- Base-image section: enumerate Bazzite stable releases in (lo, hi] ---
          # Bazzite tags stable releases as <major>.YYYYMMDD (e.g. 44.20260721) and
          # auto-generates notes containing both a curated "Major packages" summary
          # and per-image-family tables listing every package version change.
          : > /tmp/bz_releases.json
          gh api --paginate 'repos/ublue-os/bazzite/releases?per_page=100' \
            > /tmp/bz_releases.json || echo "warning: could not fetch Bazzite releases" >&2
          # Which Bazzite stable releases (non-prerelease, tag <major>.<date>) to inline:
          #   lo known      -> the range we actually crossed, lo < date <= hi
          #   first build    -> just the base we start on, date == hi (an unbounded
          #                     lower bound here would inline Bazzite's whole history)
          #   lo unknown     -> nothing; the notes say so rather than guess a range
          if [ -n "${lo_date}" ]; then bz_mode=range
          elif [ "${first_build}" = true ]; then bz_mode=first
          else bz_mode=none
          fi
          jq -r --arg lo "${lo_date}" --arg hi "${hi_date}" --arg mode "${bz_mode}" '
            .[] | select(.prerelease == false)
                | select(.tag_name | test("^[0-9]+\\.[0-9]{8}$"))
                | . as $r | ($r.tag_name | capture("\\.(?<d>[0-9]{8})$").d) as $d
                | select(if   $mode == "range" then ($d > $lo and $d <= $hi)
                         elif $mode == "first" then ($d == $hi)
                         else false end)
                | [$r.tag_name, $r.html_url, ($r.body // "")] | @json | @base64
          ' /tmp/bz_releases.json > /tmp/bz_selected.txt || true

          # Did the base actually move? Only claim a move when some variant's base
          # version really differs from what it was.
          base_moved=false
          for v in latest beelink; do
            [ "${NEW_BASE[$v]}" != "${PREV_BASE[$v]}" ] && base_moved=true
          done

          {
            echo "## Base image (Bazzite)"
            echo
            if [ "${first_build}" = true ]; then
              echo "Baseline: Bazzite \`${NEW_BASE[latest]:-$hi_date}\`."
              echo
              for v in latest beelink; do
                echo "- **:${v}** base: \`${NEW_BASE[$v]:-unknown}\`"
              done
            elif [ -z "${lo_date}" ]; then
              # base_moved is true here only because the previous base version was
              # unreadable, so there's no range to state — don't render "from `` to X".
              echo "Now on Bazzite \`${NEW_BASE[latest]:-unknown}\`."
            elif [ "${base_moved}" = false ]; then
              # Bazzite's stable channel moves on its release cadence (~weekly), so
              # most daily cron builds legitimately sit on an unchanged base. Say so
              # plainly instead of rendering "moved from X to X".
              echo "Base unchanged: Bazzite \`${NEW_BASE[latest]:-unknown}\`."
            else
              echo "Base moved from \`${lo_date}\` to \`${hi_date}\`."
              echo
              for v in latest beelink; do
                echo "- **:${v}** base: \`${PREV_BASE[$v]:-unknown}\` → \`${NEW_BASE[$v]:-unknown}\`"
              done
            fi
            echo
            if [ -n "${unknown_prev}" ]; then
              echo "_Previous base version unknown for ${unknown_prev} — base changes below may be incomplete._"
              echo
            fi
            if [ -s /tmp/bz_selected.txt ]; then
              # newest first
              tac /tmp/bz_selected.txt | while read -r line; do
                tag="$(printf '%s' "$line" | base64 -d | jq -r '.[0]')"
                url="$(printf '%s' "$line" | base64 -d | jq -r '.[1]')"
                body="$(printf '%s' "$line" | base64 -d | jq -r '.[2]')"
                echo "### Bazzite ${tag}"
                # Bazzite's notes are auto-generated with a fixed set of headings:
                # "Major packages" (a curated kernel/Mesa/KDE/NVIDIA summary), then
                # one "<family> Images" table per image family listing every package
                # version change, then "Commits" and "How to rebase" which we skip.
                # `#+` rather than `#{1,6}` so we don't rely on awk interval support.
                major="$(printf '%s\n' "$body" | awk '
                  /^#+[[:space:]]*[Mm]ajor/ {g=1; print; next}
                  g && /^#+[[:space:]]/ {g=0}
                  g {print}')"
                [ -n "$major" ] && { printf '%s\n' "$major"; echo; }
                # The per-family tables are the full package changelog and can run to
                # a hundred-plus rows, so collapse them. The blank line after
                # <summary> is required for GitHub to render the markdown tables.
                tables="$(printf '%s\n' "$body" | awk '
                  /^#+[[:space:]]*.*Images[[:space:]]*$/ {g=1; print; next}
                  g && /^#+[[:space:]]/ {g=0}
                  g {print}')"
                if [ -n "$tables" ]; then
                  echo "<details><summary>Full package changes in ${tag}</summary>"
                  echo
                  printf '%s\n' "$tables"
                  echo
                  echo "</details>"
                  echo
                fi
                echo "[Full Bazzite release notes for ${tag}](${url})"
                echo
              done
            elif [ "${base_moved}" = true ] && [ -n "${lo_date}" ]; then
              # A real range we crossed, but no Bazzite release matched it — e.g. a
              # rebuild of the same release, or notes we couldn't fetch. Worth saying.
              echo "_No matching Bazzite release notes for this range._"
              echo
            fi
          } > /tmp/base_section.md

          # --- Package section: what actually changed inside our published images --
          # The base section above only covers Bazzite's own releases. Our layer also
          # pulls Brave, the podman compose stack and kernel-devel from live repos on
          # every build, so on a frozen-base day this is the only section that can
          # show real movement. build_push publishes each image's package list as a
          # tiny `<tag>-rpmdb` sidecar image (a FROM-scratch image holding one file),
          # so reading it costs a few kB rather than a multi-GB image pull.
          fetch_rpmdb() {   # $1 = image tag (without -rpmdb), $2 = output file
            local d blob
            d="$(mktemp -d)"
            skopeo copy "docker://${REPO_IMG}:$1-rpmdb" "dir:${d}" >/dev/null 2>&1 || return 1
            blob="$(jq -r '.layers[0].digest' "${d}/manifest.json" | cut -d: -f2)"
            # No -z: GNU tar auto-detects compression, so this works whether the
            # sidecar layer was pushed gzipped or plain.
            tar -xOf "${d}/${blob}" rpmdb.txt > "$2" 2>/dev/null || return 1
            [ -s "$2" ]
          }

          pkg_changed=""
          {
            echo "## Packages in this build"
            echo
            for v in latest beelink; do
              newf="/tmp/rpmdb-new-${v}.txt"; prevf="/tmp/rpmdb-prev-${v}.txt"
              if ! fetch_rpmdb "${v}.${DATE}" "$newf"; then
                echo "- **:${v}** — _no package manifest published for this build._"
                continue
              fi
              if [ -z "${PREV_TAG[$v]}" ] || ! fetch_rpmdb "${PREV_TAG[$v]}" "$prevf"; then
                echo "- **:${v}** — _no package manifest on the previous build, so no diff yet ($(wc -l < "$newf") packages)._"
                continue
              fi
              # Both manifests are LC_ALL=C-sorted "name<TAB>version" with one line
              # per name, so a full outer join keyed on the name yields every change:
              # missing left = added, missing right = removed, else updated.
              rows="$(LC_ALL=C join -t"$(printf '\t')" -a1 -a2 -e '' -o 0,1.2,2.2 \
                        "$prevf" "$newf" \
                      | awk -F'\t' '$2 != $3 {
                          if ($2 == "")      printf "| ➕ | %s | | %s |\n", $1, $3;
                          else if ($3 == "") printf "| ❌ | %s | %s | |\n", $1, $2;
                          else               printf "| 🔄 | %s | %s | %s |\n", $1, $2, $3;
                        }')"
              if [ -z "$rows" ]; then
                echo "- **:${v}** — no package changes since \`${PREV_TAG[$v]}\`."
              else
                pkg_changed=1
                echo "<details><summary><b>:${v}</b> — $(printf '%s\n' "$rows" | wc -l) package changes since <code>${PREV_TAG[$v]}</code></summary>"
                echo
                echo "| | Name | Previous | New |"
                echo "| --- | --- | --- | --- |"
                printf '%s\n' "$rows"
                echo
                echo "</details>"
                echo
              fi
            done
            echo
          } > /tmp/pkg_section.md

          # --- Custom-build section: commits since the previous GitHub release -----
          prev_rel_tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$prev_rel_tag" ] && git rev-parse -q --verify "refs/tags/${prev_rel_tag}" >/dev/null; then
            commits="$(git log "${prev_rel_tag}..HEAD" --pretty=format:'- %s (%h)')"
          else
            commits=""
          fi
          {
            echo "## Custom build (this repo)"
            echo
            if [ -n "$commits" ]; then
              printf '%s\n' "$commits"
            elif [ -z "$prev_rel_tag" ]; then
              echo "Initial release."
            else
              echo "_No repository changes since ${prev_rel_tag}._"
            fi
            echo
          } > /tmp/custom_section.md

          # --- Change gate: skip if nothing at all changed ------------------------
          # Includes the package diff, so a frozen-base day with no commits still
          # gets a release when packages actually moved. Builds aren't reproducible
          # but package *sets* are stable, so genuinely idle days still produce
          # nothing.
          if [ ! -s /tmp/bz_selected.txt ] && [ -z "$commits" ] && [ -z "$pkg_changed" ] \
             && [ -n "$prev_rel_tag" ]; then
            echo "No base-image change, no package changes and no new commits — skipping release."
            exit 0
          fi

          # --- Assemble and publish ----------------------------------------------
          TAG="${DATE:0:4}-${DATE:4:2}-${DATE:6:2}"
          {
            cat /tmp/base_section.md
            cat /tmp/pkg_section.md
            cat /tmp/custom_section.md
            echo "---"
            echo "Rebase instructions: see the [README](https://github.com/${{ github.repository }}#readme)."
          } > /tmp/body.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/body.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/body.md --target "${GITHUB_SHA}"
          fi
